<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theoretical Minimum Roadmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center cursor-pointer" onclick="navigate('home')">
                    <svg class="w-8 h-8 text-brand-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span class="font-bold text-xl tracking-tight text-slate-900">Physics Roadmap</span>
                </div>
                <div class="flex items-center">
                    <button onclick="navigate('home')" class="text-slate-600 hover:text-brand-600 font-medium px-3 py-2 rounded-md transition-colors">
                        Dashboard
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <!-- Content gets injected here via JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-slate-500 text-sm">
            Designed for the fast-track to theoretical physics research. Contains links to open-access university resources.
        </div>
    </footer>

    <script>
        // Data Structure for the Courses
        const courses = [
            {
                id: 'pillar-1',
                title: "Classical Dynamics",
                author: "David Tong",
                institution: "University of Cambridge",
                link: "http://www.damtp.cam.ac.uk/user/tong/dynamics.html",
                tag: "Pillar 1",
                description: "Sleek, modern, and directly emphasizes symmetries, phase space geometry, and Hamiltonian mechanics needed for field theory.",
                problemSets: "Example Sheets 1 through 4 (available on Tong’s website). Solutions widely available online.",
                chapters: [
                    { title: "1. Newtonian Mechanics & Principle of Least Action", details: "Generalized coordinates, configuration space, Hamilton's Principle, Euler-Lagrange equations.", action: "None yet." },
                    { title: "2. Lagrangian Mechanics & Noether’s Theorem", details: "Cyclic coordinates, continuous symmetries, conserved currents.", action: "Complete Example Sheet 1 immediately after this chapter." },
                    { title: "3. Small Oscillations & Rigid Bodies", details: "Linearization, normal coordinates, inertia tensor, Euler angles. Continuous spring-chains.", action: "Complete Example Sheet 2. Crucial for scalar field theory." },
                    { title: "4. The Hamiltonian Formalism", details: "Legendre transform, phase space, Liouville's theorem, Poisson brackets.", action: "Complete Example Sheets 3 & 4. Master Poisson brackets for canonical quantization." }
                ]
            },
            {
                id: 'pillar-2',
                title: "Classical Electrodynamics",
                author: "Konstantin K. Likharev",
                institution: "Stony Brook University",
                link: "https://commons.library.stonybrook.edu/egp/",
                tag: "Pillar 2",
                description: "Covers the full graduate Jackson curriculum. Most importantly, every single exercise has a complete, fully worked-out solution.",
                problemSets: "Embedded within the Essential Graduate Physics (EGP) PDFs with official solutions.",
                chapters: [
                    { title: "EM 1 & 2: Electrostatics & Boundary Problems", details: "Gauss’s law, Laplace/Poisson equations, Green’s functions, method of images.", action: "Do problems 1.1–1.12 and 2.1–2.15 immediately." },
                    { title: "EM 3 & 4: Magnetostatics & Electrodynamics", details: "Vector potential A, Faraday induction, Poynting vector, Maxwell stress tensor.", action: "Solve Chapter 3 & 4 exercises. Focus on energy-momentum conservation." },
                    { title: "EM 6–8: Electromagnetic Waves & Radiation", details: "Dispersion, wave guides, dipole radiation, Liénard-Wiechert potentials.", action: "Work through the radiation problems in EM 8." },
                    { title: "EM 9: Special Relativity & Covariant EM", details: "4-vectors, field-strength tensor, covariant Maxwell equations.", action: "Solve all Chapter 9 exercises. Essential index notation practice for GR and QFT." }
                ]
            },
            {
                id: 'pillar-3',
                title: "Graduate Quantum Mechanics",
                author: "Robert Littlejohn",
                institution: "UC Berkeley",
                link: "https://bohr.physics.berkeley.edu/classes/221/1112/221.html",
                tag: "Pillar 3",
                description: "The most mathematically transparent QM treatment. Bridges pure linear algebra and physical application, explaining geometric phases and group theory.",
                problemSets: "Berkeley Physics 221A/B Homework Archives. Extremely rigorous.",
                chapters: [
                    { title: "Notes 1–6: Math Framework & Postulates", details: "Ket/Bra space, unbounded operators, spectral theorem, density matrices.", action: "Solve Problem Set 1 (Bra-ket algebra and projection operators)." },
                    { title: "Notes 7–13: Symmetries, Rotations & Angular Momentum", details: "Lie algebras, SO(3) vs SU(2), Wigner D-matrices, Clebsch-Gordan coefficients.", action: "Work through Problem Sets 3 & 4. Master the Wigner-Eckart Theorem." },
                    { title: "Notes 14–22: Bound States & Geometric Phases", details: "Gauge invariance in QM, Aharonov-Bohm effect, Landau levels, Berry's phase.", action: "Solve the Aharonov-Bohm and Landau level problems in HW 6." },
                    { title: "Notes 23–30: Approximation Methods & Scattering", details: "Time-independent/dependent perturbation theory, WKB, partial wave scattering.", action: "Solve scattering and Stark effect problems from HW 8 & 9." }
                ]
            },
            {
                id: 'pillar-4',
                title: "Statistical Field Theory",
                author: "David Tong",
                institution: "University of Cambridge",
                link: "http://www.damtp.cam.ac.uk/user/tong/sft.html",
                tag: "Pillar 4",
                description: "Exceptional modern perspective on phase transitions, Landau-Ginzburg theory, and Wilsonian renormalization group flow.",
                problemSets: "Cambridge Part III Tripos Example Sheets 1–3.",
                chapters: [
                    { title: "1. From Particles to Fields", details: "Ising model, transfer matrices, continuum limits, mean field theory breakdown.", action: "Complete Example Sheet 1 after Chapter 1." },
                    { title: "2. Landau-Ginzburg Theory", details: "Order parameters, spontaneous symmetry breaking, domain walls, Ginzburg criterion.", action: "Work on the first half of Example Sheet 2." },
                    { title: "3. The Renormalization Group (RG)", details: "Kadanoff spin-blocking, Wilsonian RG, fixed points, beta functions.", action: "Complete Example Sheet 2 & 3. Critical for high-energy & condensed matter." }
                ]
            },
            {
                id: 'pillar-5',
                title: "General Relativity",
                author: "Sean M. Carroll",
                institution: "arXiv / Caltech",
                link: "https://arxiv.org/abs/gr-qc/9712019",
                tag: "Pillar 5",
                description: "Beautiful and intuitive introduction to spacetime curvature, black holes, and cosmology. The gold standard for transitioning into gravity research.",
                problemSets: "Exercises at the end of each chapter PDF. Solutions widely available in university archives.",
                chapters: [
                    { title: "1. Special Relativity and Flat Spacetime", details: "Metric tensor, 4-momentum, Levi-Civita symbol, classical field theory review.", action: "Review basic index mechanics." },
                    { title: "2 & 3. Manifolds & Curvature", details: "Dual vectors, covariant derivatives, Christoffel symbols, Riemann curvature tensor.", action: "Do the exercises. Calculate Christoffel symbols for a 2-sphere by hand." },
                    { title: "4. Gravitation & The Einstein Field Equations", details: "Principle of equivalence, Einstein-Hilbert action, stress-energy tensor.", action: "Work through stress-energy tensor derivations in Chapter 4 problems." },
                    { title: "5–8. Black Holes, Radiation & Cosmology", details: "Schwarzschild metric, event horizons, linearized gravity, FLRW metric.", action: "Complete geodesic trajectory problems for Chapter 7." }
                ]
            },
            {
                id: 'pillar-6',
                title: "Quantum Field Theory",
                author: "David Tong",
                institution: "University of Cambridge",
                link: "http://www.damtp.cam.ac.uk/user/tong/qft.html",
                tag: "Pillar 6",
                description: "Legendary notes. Unmatched clarity for canonical quantization, Feynman diagrams, spinor fields, and basic tree-level scattering.",
                problemSets: "Cambridge Part III QFT Example Sheets 1–4.",
                chapters: [
                    { title: "1. Classical Field Theory", details: "Field action, Euler-Lagrange equations for fields, Noether’s theorem, energy-momentum tensor.", action: "Complete Example Sheet 1." },
                    { title: "2. Canonical Quantization of Scalar Fields", details: "Klein-Gordon field, creation/annihilation operators, vacuum energy, Feynman propagator.", action: "Work through propagator and commutator problems in Example Sheet 2." },
                    { title: "3. Interacting Fields & Feynman Diagrams", details: "Interaction picture, Wick’s theorem, Feynman rules, cross-sections, decay rates.", action: "Complete Example Sheet 3. Calculate 2-to-2 scattering amplitudes at tree-level." },
                    { title: "4 & 5. Dirac Equation & QED", details: "Lorentz group, Dirac gamma matrices, gauge invariance, Ward identity.", action: "Complete fermion scattering and trace identities in Example Sheet 4." }
                ]
            }
        ];

        // Icons
        const icons = {
            arrowRight: `<svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`,
            arrowLeft: `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>`,
            external: `<svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>`,
            book: `<svg class="w-5 h-5 text-brand-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>`
        };

        // DOM Elements
        const appContent = document.getElementById('app-content');

        // Render Dashboard (Home)
        function renderHome() {
            let html = `
                <div class="fade-in">
                    <div class="mb-10 text-center md:text-left">
                        <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4">The Theoretical Minimum Agenda</h1>
                        <p class="text-lg text-slate-600 max-w-3xl">A free, self-contained, and mathematically rigorous study plan to take you from a 3rd-year undergraduate level directly to reading modern physics research papers.</p>
                        
                        <div class="mt-8 bg-brand-50 rounded-xl p-6 border border-brand-100 flex flex-col md:flex-row items-center gap-6">
                            <div class="bg-white p-3 rounded-full shadow-sm">
                                <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900 text-lg">Execution Strategy</h3>
                                <p class="text-slate-700 text-sm mt-1">Study order: <strong>Pillars 1 ➔ 2 ➔ 3</strong>. Then choose your pathway: High-Energy (<strong>5 ➔ 6</strong>) or Condensed Matter (<strong>4 ➔ 6</strong>). Follow the <strong>60/40 Rule</strong>: Spend 60% of your time working problems, 40% reading.</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;

            courses.forEach(course => {
                html += `
                    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-lg transition-all duration-300 flex flex-col cursor-pointer group" onclick="navigate('${course.id}')">
                        <div class="mb-4">
                            <span class="inline-block px-3 py-1 bg-brand-100 text-brand-700 text-xs font-bold rounded-full mb-3">${course.tag}</span>
                            <h2 class="text-xl font-bold text-slate-900 group-hover:text-brand-600 transition-colors">${course.title}</h2>
                            <p class="text-sm text-slate-500 mt-1 flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                ${course.author}
                            </p>
                        </div>
                        <p class="text-slate-600 text-sm flex-grow mb-6 line-clamp-3">
                            ${course.description}
                        </p>
                        <div class="flex items-center text-brand-600 font-medium text-sm mt-auto group-hover:translate-x-1 transition-transform">
                            View Syllabus ${icons.arrowRight}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        // Render Course Details
        function renderPillar(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return renderHome();

            let html = `
                <div class="fade-in max-w-4xl mx-auto">
                    <!-- Back Button -->
                    <button onclick="navigate('home')" class="flex items-center text-slate-500 hover:text-brand-600 font-medium text-sm mb-8 transition-colors">
                        ${icons.arrowLeft} Back to Dashboard
                    </button>

                    <!-- Header -->
                    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm mb-8 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-8 opacity-5 pointer-events-none">
                            <svg class="w-48 h-48" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <span class="inline-block px-3 py-1 bg-brand-100 text-brand-700 text-sm font-bold rounded-full mb-4">${course.tag}</span>
                        <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-3">${course.title}</h1>
                        <div class="flex flex-wrap items-center gap-4 text-slate-600 mb-6">
                            <span class="flex items-center font-medium">
                                <svg class="w-5 h-5 mr-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                ${course.author}
                            </span>
                            <span class="hidden md:inline text-slate-300">•</span>
                            <span class="flex items-center font-medium">
                                <svg class="w-5 h-5 mr-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                ${course.institution}
                            </span>
                        </div>
                        <p class="text-lg text-slate-700 mb-8 max-w-2xl leading-relaxed">${course.description}</p>
                        
                        <a href="${course.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl transition-colors shadow-sm hover:shadow">
                            Access Source Material ${icons.external}
                        </a>
                    </div>

                    <!-- Problem Sets Alert -->
                    <div class="bg-amber-50 border-l-4 border-amber-400 p-5 rounded-r-xl mb-8">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <svg class="h-6 w-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                </svg>
                            </div>
                            <div class="ml-3">
                                <h3 class="text-sm font-bold text-amber-800">Problem Sets Strategy</h3>
                                <p class="text-sm text-amber-700 mt-1">${course.problemSets}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Chapter Guide -->
                    <h2 class="text-2xl font-bold text-slate-900 mb-6 flex items-center">
                        ${icons.book} Chapter-by-Chapter Guide
                    </h2>
                    <div class="space-y-4">
            `;

            course.chapters.forEach((chapter, index) => {
                html += `
                    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <div class="px-6 py-4 bg-slate-50 border-b border-slate-100">
                            <h3 class="font-bold text-slate-900 text-lg">${chapter.title}</h3>
                        </div>
                        <div class="p-6">
                            <div class="mb-4">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Core Focus</span>
                                <p class="text-slate-700">${chapter.details}</p>
                            </div>
                            <div class="bg-brand-50/50 rounded-lg p-4 border border-brand-100/50">
                                <span class="text-xs font-bold uppercase tracking-wider text-brand-600 block mb-1">When to do problems</span>
                                <p class="text-brand-900 text-sm font-medium">${chapter.action}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
            window.scrollTo(0, 0);
        }

        // Router
        function navigate(pageOrId) {
            if (pageOrId === 'home') {
                renderHome();
            } else {
                renderPillar(pageOrId);
            }
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderHome();
        });
    </script>
</body>
</html>
